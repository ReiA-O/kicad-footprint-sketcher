name: Stage 1 Windows verification
on:
  push:
    branches: [feat/stage-1-image-to-footprint]
    paths: [.github/workflows/windows-stage1.yml]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Drive the Windows desktop app from image to footprint
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from tkinter import Tk
          from unittest.mock import patch

          from PIL import Image

          from footprint_sketcher.gui import SketcherApp

          def click(app, point):
              x, y = app.canvas.image_to_canvas(point)
              assert (x, y) == (int(x), int(y)), (x, y, app.canvas.scale)
              app.canvas.event_generate('<Button-1>', x=int(x), y=int(y))
              app.root.update()

          def check(extension, directory):
              root = Tk()
              try:
                  app = SketcherApp(root)
                  root.geometry('1150x750')
                  root.update()
                  image_path = directory / f'land-pattern.{extension}'
                  with Image.open(Path('examples/stage1') / image_path.name) as source:
                      source.resize((450, 280)).save(image_path)
                  app.load_image(image_path)
                  root.update()
                  assert app.canvas.image.size == (450, 280)
                  app.begin_calibration()
                  click(app, (75, 222))
                  click(app, (375, 222))
                  app.distance.set('10')
                  app.apply_calibration()
                  assert app.sketch.calibration.mm_per_pixel == 10 / 300
                  app.center_origin()
                  assert app.sketch.origin == (225, 140)
                  app.pad_number.set('1')
                  app.pad_width.set('1.6')
                  app.pad_height.set('1.2')
                  app.pad_angle.set('30')
                  app.pad_radius.set('0.25')
                  app.begin_placement()
                  click(app, (150, 110))
                  pad, = app.sketch.pads
                  assert (pad.x, pad.y, pad.width, pad.height, pad.angle, pad.radius) == (-2.5, -1, 1.6, 1.2, 30, 0.25)
                  app.footprint_name.set(f'Windows_{extension}')
                  with patch('footprint_sketcher.gui.filedialog.askdirectory', return_value=str(directory)):
                      app.export()
                  output = (directory / f'Windows_{extension}.kicad_mod').read_text(encoding='utf-8')
                  assert '(version 20260206)' in output
                  assert '(at -2.5 -1.0 30.0)' in output
                  assert '(layers "F.Cu" "F.Paste" "F.Mask")' in output
                  assert '(pad "1" smd roundrect' in output
                  assert '(image' not in output
                  print(f'{extension.upper()} flow passed with Tk {root.tk.call("info", "patchlevel")}')
              finally:
                  root.destroy()

          with TemporaryDirectory() as directory:
              for extension in ('png', 'jpg'):
                  check(extension, Path(directory))
          '@ | python -
